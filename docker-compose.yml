services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Only reachable through the frontend's nginx by default. Uncomment to
    # expose the API directly (then set EDGECRAFT_API_TOKEN in backend/.env).
    # ports:
    #   - "127.0.0.1:8000:8000"
    # Optional: copy backend/.env.example to backend/.env to set API keys,
    # an API token, upload limits, etc. Runs with defaults without it.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - EDGECRAFT_STORAGE_DIR=/data
    volumes:
      - ./backend/data_storage:/data
      # Pretrained ImageNet weights downloaded by Keras (kept across rebuilds)
      - keras-cache:/root/.keras
    extra_hosts:
      # Reach an Ollama server on the host: OLLAMA_HOST=http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # NVIDIA GPU (requires nvidia-container-toolkit and requirements-gpu.txt):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # App on http://localhost:3990 (override: EDGECRAFT_PORT=8080 docker compose up)
    ports:
      - "${EDGECRAFT_PORT:-3990}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  keras-cache:
